services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  backend:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  db_data:
  uploads_data:
