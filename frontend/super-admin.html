<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - Tablik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/super-admin.css">
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Tablik</div>
    <h1>Super Admin</h1>
  </div>
  <button id="boutonDeconnexion">Déconnexion</button>
</header>

<nav>
  <button class="onglet actif" data-panneau="panneauDemandes">Demandes en attente</button>
  <button class="onglet" data-panneau="panneauRestaurants">Tous les restaurants</button>
  <button class="onglet" data-panneau="panneauHistoriqueDemandes">Historique</button>
  <button class="onglet" data-panneau="panneauParrains">Parrains</button>
  <button class="onglet" data-panneau="panneauRetraits">Retraits</button>
  <button class="onglet" data-panneau="panneauReglages">Réglages</button>
</nav>

<main>

  <section id="panneauDemandes" class="panneau actif">
    <div class="barre-action">
      <h2>Demandes en attente</h2>
    </div>
    <div id="listeDemandes"></div>
  </section>

  <section id="panneauRestaurants" class="panneau">
    <div class="barre-action">
      <h2>Tous les restaurants</h2>
    </div>
    <input type="text" id="rechercheRestaurants" placeholder="Rechercher un restaurant...">
    <table class="tableau-restaurants">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Statut</th>
          <th>Échéance</th>
          <th>Téléphone</th>
        </tr>
      </thead>
      <tbody id="corpsTableauRestaurants"></tbody>
    </table>
  </section>

  <section id="panneauHistoriqueDemandes" class="panneau">
    <div class="barre-action">
      <h2>Historique des demandes traitées</h2>
    </div>
    <div id="listeHistoriqueDemandes"></div>
  </section>
  <section id="panneauParrains" class="panneau">
  <div class="barre-action">
    <h2>Les parrains</h2>
    <button class="bouton-principal" id="boutonAjouterParrain">Ajouter un parrain</button>
  </div>
  <div id="listeParrains"></div>
</section>

<section id="panneauRetraits" class="panneau">
  <div class="barre-action">
    <h2>Demandes de retrait en attente</h2>
  </div>
  <div id="listeRetraits"></div>

  <div class="barre-action" style="margin-top:30px;">
    <h2>Historique des retraits traités</h2>
  </div>
  <div id="listeHistoriqueRetraits"></div>
</section>

  <section id="panneauReglages" class="panneau">
    <div class="barre-action">
      <h2>Réglages</h2>
    </div>
    <div class="reglage-carte">
      <form id="formReglages">
        <label for="reglageMontant">Montant mensuel (FCFA)</label>
        <input type="number" id="reglageMontant" min="0" required>

        <label for="reglageMtn">Numéro MTN Mobile Money</label>
        <input type="text" id="reglageMtn">

        <label for="reglageMoov">Numéro Moov Money</label>
        <input type="text" id="reglageMoov">

        <label for="reglageCeltiis">Numéro Celtiis Cash</label>
        <input type="text" id="reglageCeltiis">

        <button type="submit" class="bouton-principal">Enregistrer</button>
      </form>
    </div>
  </section>

</main>

<div class="overlay-abonnement" id="modaleParrainFond" style="background: rgba(27,42,65,0.45);">
  <div class="carte-blocage" style="text-align:left; max-width:380px;">
    <h2 style="margin-bottom:16px;">Ajouter un parrain</h2>
    <form id="formParrain">
      <label style="display:block; font-size:12.5px; font-weight:500; color:var(--ardoise); margin-bottom:5px;">Nom</label>
      <input type="text" id="parrainNom" required style="width:100%; padding:9px 11px; border:1.5px solid #E4E1DA; border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:12px;">

      <label style="display:block; font-size:12.5px; font-weight:500; color:var(--ardoise); margin-bottom:5px;">Identifiant de connexion</label>
      <input type="text" id="parrainIdentifiant" required style="width:100%; padding:9px 11px; border:1.5px solid #E4E1DA; border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:12px;">

      <label style="display:block; font-size:12.5px; font-weight:500; color:var(--ardoise); margin-bottom:5px;">Mot de passe</label>
      <input type="text" id="parrainMotDePasse" required style="width:100%; padding:9px 11px; border:1.5px solid #E4E1DA; border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:12px;">

      <label style="display:block; font-size:12.5px; font-weight:500; color:var(--ardoise); margin-bottom:5px;">Pourcentage de commission (%)</label>
      <input type="number" id="parrainPourcentage" min="0" max="100" step="0.5" value="10" required style="width:100%; padding:9px 11px; border:1.5px solid #E4E1DA; border-radius:6px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:16px;">

      <div style="display:flex; gap:8px;">
        <button type="button" id="boutonAnnulerParrain" style="flex:1; background:var(--papier); color:var(--encre); border:none; padding:10px; border-radius:7px; font-size:13.5px; cursor:pointer;">Annuler</button>
        <button type="submit" style="flex:1; background:var(--encre); color:var(--papier); border:none; padding:10px; border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer;">Créer</button>
      </div>
    </form>
  </div>
</div>

<script src="js/super-admin.js"></script>
<script src="js/enregistrer-pwa.js"></script>
</body>
</html>
