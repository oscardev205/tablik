<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changer le mot de passe - Tablik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/changer-mot-de-passe.css">
</head>
<body>

<div class="ticket">
  <div class="ticket-contenu">
    <div class="eyebrow">Tablik</div>
    <h1>Nouveau mot de passe</h1>
    <div class="explication">Pour la sécurité de votre compte, vous devez choisir un nouveau mot de passe avant de continuer.</div>
    <form id="formChangement">
      <label for="ancienMotDePasse">Mot de passe actuel</label>
      <input type="password" id="ancienMotDePasse" required>

      <label for="nouveauMotDePasse">Nouveau mot de passe</label>
      <input type="password" id="nouveauMotDePasse" required minlength="6">

      <label for="confirmationMotDePasse">Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirmationMotDePasse" required minlength="6">

      <button type="submit">Valider</button>
    </form>
    <div id="message"></div>
  </div>
</div>

<script src="js/changer-mot-de-passe.js"></script>
</body>
</html>
